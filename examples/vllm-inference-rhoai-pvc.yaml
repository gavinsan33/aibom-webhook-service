# PVC-backed variant of vllm-inference-rhoai.yaml.
#
# Instead of vLLM pulling the model from Hugging Face Hub, this serves a model
# that is already sitting on a PersistentVolumeClaim (storageUri: pvc://...),
# the way RHOAI's "existing PVC" model-serving option does. KServe mounts the
# claim's subpath at /mnt/models, so the serving container's only model
# argument is the fixed `--model=/mnt/models` — nothing on the command line
# says which model this is. The webhook recovers the identity by mounting the
# same claim read-only into the aibom-discovery init container and reading the
# model's own README/config.json/HF download metadata (see CLAUDE.md, "Model
# Auto-Detection"), so the AIBOM reports e.g. Qwen/Qwen2.5-32B-Instruct rather
# than the folder name.
#
# Prerequisite: a PVC named llm-serving-storage in this namespace holding a
# Hugging Face snapshot (e.g. `hf download Qwen/Qwen2.5-32B-Instruct
# --local-dir <pvc>/qwen-32b`). Adjust the claim/folder in storageUri otherwise.
#
# The predictor Service is headless, so clients dial the container port (8080)
# directly rather than the Service's port 80.
#
# Same lifecycle as vllm-inference-rhoai.yaml: the client Job benchmarks the
# predictor, then deletes the InferenceService (and, here, the ServingRuntime
# this file creates) and its own RBAC. Deleting the InferenceService deletes
# the predictor pod, which triggers the watcher's pod-level finalizer path.
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: aibom-vllm-qwen-pvc
  namespace: project-gavin-test
spec:
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhoai/odh-vllm-cuda-rhel9@sha256:293c6eb7571bd239516a175b1ebbd4e4bc3b1076022d7aaf6b7f16264227aebf
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
      env:
        - name: HF_HOME
          value: /tmp/hf_home
      ports:
        - containerPort: 8080
          protocol: TCP
      volumeMounts:
        - mountPath: /dev/shm
          name: shm
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  volumes:
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 2Gi
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: aibom-vllm-qwen-pvc
  namespace: project-gavin-test
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    annotations:
      aibom.io/experiment-intent: inference
      aibom.io/experiment-name: vllm-qwen-pvc-benchmark
    tolerations:
      - operator: Exists
    model:
      modelFormat:
        name: vLLM
      runtime: aibom-vllm-qwen-pvc
      storageUri: pvc://llm-serving-storage/qwen-32b
      args:
        - --gpu-memory-utilization=0.95
        - --max-model-len=8192
      resources:
        requests:
          cpu: "4"
          memory: 6Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "6"
          memory: 30Gi
          nvidia.com/gpu: "1"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aibom-vllm-qwen-pvc-client
  namespace: project-gavin-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aibom-vllm-qwen-pvc-client
  namespace: project-gavin-test
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices", "servingruntimes"]
    resourceNames: ["aibom-vllm-qwen-pvc"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["aibom-vllm-qwen-pvc-client"]
    verbs: ["delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    resourceNames: ["aibom-vllm-qwen-pvc-client"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aibom-vllm-qwen-pvc-client
  namespace: project-gavin-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aibom-vllm-qwen-pvc-client
subjects:
  - kind: ServiceAccount
    name: aibom-vllm-qwen-pvc-client
    namespace: project-gavin-test
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aibom-vllm-qwen-pvc-client
  namespace: project-gavin-test
spec:
  backoffLimit: 0
  # Loading a ~65GB model off NFS dominates; this covers wait + benchmark.
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: aibom-vllm-qwen-pvc-client
      tolerations:
        - operator: Exists
      initContainers:
        - name: wait-for-predictor
          image: docker.io/curlimages/curl:8.11.0
          command:
            - sh
            - -c
            - |
              until curl -sf http://aibom-vllm-qwen-pvc-predictor.project-gavin-test.svc.cluster.local:8080/health; do
                echo "waiting for predictor..."
                sleep 10
              done
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
        - name: benchmark
          image: ghcr.io/vllm-project/guidellm@sha256:e3ad2371bfa8e42f2c3d1251b62d0d9c9706c27ae2143c8c048eb5fc6aebb558
          imagePullPolicy: Always
          command:
            - guidellm
            - run
            - --backend=kind=openai_http,target=http://aibom-vllm-qwen-pvc-predictor.project-gavin-test.svc.cluster.local:8080
            # The served model name is the InferenceService name, which isn't
            # a Hugging Face repo, so tell guidellm which tokenizer to use.
            - --tokenizer=kind=huggingface_auto,model=Qwen/Qwen2.5-32B-Instruct
            - --data=kind=synthetic_text,prompt_tokens=256,output_tokens=128
            - --profile=kind=sweep
            - --constraint=kind=max_duration,seconds=30
            - --output=kind=json
          env:
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
      containers:
        - name: delete-inferenceservice
          image: docker.io/curlimages/curl:8.11.0
          command:
            - sh
            - -c
            - |
              TOKEN=/var/run/secrets/kubernetes.io/serviceaccount/token
              CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              NS=project-gavin-test
              del() {
                curl -sf -X DELETE --cacert "$CACERT" \
                  -H "Authorization: Bearer $(cat $TOKEN)" "https://kubernetes.default.svc$1"
              }
              # InferenceService and ServingRuntime first (these must succeed).
              del /apis/serving.kserve.io/v1beta1/namespaces/$NS/inferenceservices/aibom-vllm-qwen-pvc
              del /apis/serving.kserve.io/v1alpha1/namespaces/$NS/servingruntimes/aibom-vllm-qwen-pvc
              # Then this Job's own RBAC, best-effort: deleting the RoleBinding
              # revokes the very token making these calls, so whatever comes
              # after it gets a 403. Anything left over is removed by
              # examples/cleanup.sh.
              del /apis/rbac.authorization.k8s.io/v1/namespaces/$NS/rolebindings/aibom-vllm-qwen-pvc-client || true
              del /apis/rbac.authorization.k8s.io/v1/namespaces/$NS/roles/aibom-vllm-qwen-pvc-client || true
              del /api/v1/namespaces/$NS/serviceaccounts/aibom-vllm-qwen-pvc-client || true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
