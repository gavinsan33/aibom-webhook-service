apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: aibom-vllm-benchmark
  namespace: project-gavin-test
spec:
  replicatedJobs:
    - name: server
      replicas: 1
      template:
        metadata:
          annotations:
            aibom.io/experiment-intent: inference
            aibom.io/experiment-name: vllm-granite-benchmark

        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          activeDeadlineSeconds: 600
          template:
            spec:
              restartPolicy: Never
              tolerations:
                - operator: Exists
              containers:
                - name: server
                  image: nvcr.io/nvidia/vllm:26.03-py3
                  command:
                    - python
                    - -m
                    - vllm.entrypoints.openai.api_server
                    - --model=drawais/Granite-3.3-8B-Instruct-AWQ-INT4
                    - --port=8000
                    - --max-model-len=10000
                    - --gpu-memory-utilization=0.6
                    - '--override-generation-config={"temperature": 0.7, "top_p": 0.9, "top_k": 20}'
                    - '--speculative-config={"method": "ngram", "num_speculative_tokens": 5, "prompt_lookup_max": 4}'
                  env:
                    - name: HOME
                      value: /tmp
                    - name: HF_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: hf-token-secret
                          key: HF_TOKEN
                          optional: true
                  ports:
                    - containerPort: 8000
                      name: http
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 8000
                    initialDelaySeconds: 30
                    periodSeconds: 10
                  resources:
                    requests:
                      nvidia.com/gpu: "1"
                    limits:
                      nvidia.com/gpu: "1"

    - name: client
      replicas: 1
      template:
        spec:
          parallelism: 1
          completions: 1
          backoffLimit: 0
          activeDeadlineSeconds: 600
          template:
            spec:
              restartPolicy: Never
              serviceAccountName: aibom-vllm-benchmark-client
              tolerations:
                - operator: Exists
              initContainers:
                - name: benchmark
                  image: ghcr.io/vllm-project/guidellm@sha256:e3ad2371bfa8e42f2c3d1251b62d0d9c9706c27ae2143c8c048eb5fc6aebb558
                  imagePullPolicy: Always
                  command:
                    - guidellm
                    - run
                    - --backend=kind=openai_http,target=http://aibom-vllm-benchmark-server-0-0.aibom-vllm-benchmark.project-gavin-test.svc.cluster.local:8000
                    - --data=kind=synthetic_text,prompt_tokens=256,output_tokens=128
                    - --profile=kind=sweep
                    - --constraint=kind=max_duration,seconds=30
                    - --output=kind=json
                  env:
                    - name: HOME
                      value: /tmp
              containers:
                - name: delete-server-job
                  image: docker.io/curlimages/curl:8.11.0
                  command:
                    - sh
                    - -c
                    - |
                      TOKEN=/var/run/secrets/kubernetes.io/serviceaccount/token
                      CACERT=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                      NS=project-gavin-test
                      curl -sf -X DELETE --cacert "$CACERT" \
                        -H "Authorization: Bearer $(cat $TOKEN)" \
                        "https://kubernetes.default.svc/apis/batch/v1/namespaces/$NS/jobs/aibom-vllm-benchmark-server-0?propagationPolicy=Background"
                      curl -sf -X DELETE --cacert "$CACERT" \
                        -H "Authorization: Bearer $(cat $TOKEN)" \
                        "https://kubernetes.default.svc/apis/rbac.authorization.k8s.io/v1/namespaces/$NS/rolebindings/aibom-vllm-benchmark-client"
                      curl -sf -X DELETE --cacert "$CACERT" \
                        -H "Authorization: Bearer $(cat $TOKEN)" \
                        "https://kubernetes.default.svc/apis/rbac.authorization.k8s.io/v1/namespaces/$NS/roles/aibom-vllm-benchmark-client"
                      curl -sf -X DELETE --cacert "$CACERT" \
                        -H "Authorization: Bearer $(cat $TOKEN)" \
                        "https://kubernetes.default.svc/api/v1/namespaces/$NS/serviceaccounts/aibom-vllm-benchmark-client"
                  resources:
                    requests:
                      cpu: "100m"
                      memory: "128Mi"
                    limits:
                      cpu: "200m"
                      memory: "256Mi"
      dependsOn:
        - name: server
          status: Ready
  successPolicy:
    operator: All
    targetReplicatedJobs:
      - client
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aibom-vllm-benchmark-client
  namespace: project-gavin-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aibom-vllm-benchmark-client
  namespace: project-gavin-test
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    resourceNames: ["aibom-vllm-benchmark-server-0"]
    verbs: ["delete"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: ["aibom-vllm-benchmark-client"]
    verbs: ["delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    resourceNames: ["aibom-vllm-benchmark-client"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aibom-vllm-benchmark-client
  namespace: project-gavin-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aibom-vllm-benchmark-client
subjects:
  - kind: ServiceAccount
    name: aibom-vllm-benchmark-client
    namespace: project-gavin-test
