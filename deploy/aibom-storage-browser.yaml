apiVersion: v1
kind: ConfigMap
metadata:
  name: aibom-storage-nginx-conf
  namespace: aibom-system
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      sendfile on;
      keepalive_timeout 65;
      include /etc/nginx/conf.d/*.conf;
    }
  default.conf: |
    server {
      listen 8080;
      location / {
        root /data/aiboms;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: aibom-storage
  namespace: aibom-system
spec:
  selector:
    app: aibom-webhook
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
