apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: aibom-webhook
  annotations:
    # cert-manager's cainjector controller watches for this annotation and
    # keeps clientConfig.caBundle (below) populated and in sync with
    # deploy/certificates.yaml's Certificate automatically, including on renewal.
    cert-manager.io/inject-ca-from: aibom-system/aibom-webhook-certs
webhooks:
  - name: aibom-webhook.aibom-system.svc
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    reinvocationPolicy: Never
    namespaceSelector:
      matchLabels:
        aibom.io/enabled: "true"
    rules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
    clientConfig:
      service:
        name: aibom-webhook
        namespace: aibom-system
        path: /mutate
        port: 443
      # Populated automatically by cert-manager's cainjector (see the
      # cert-manager.io/inject-ca-from annotation above) -- do not hand-edit.
      caBundle: ""
