# Requires cert-manager (https://cert-manager.io/) installed in the cluster.
#
# Replaces the manual cluster cert-provisioning half of scripts/generate-certs.sh:
# issues the webhook's server certificate into the same aibom-webhook-certs
# Secret that deploy/deployment.yaml already mounts, and keeps it renewed
# automatically instead of expiring silently after 365 days. The CA bundle
# needed by deploy/webhook-config.yaml's clientConfig is injected automatically
# by cert-manager's cainjector via that file's cert-manager.io/inject-ca-from
# annotation, instead of being pasted in by hand.
#
# scripts/generate-certs.sh is unchanged and still used for local dev
# (`make run`), which never touches a cluster.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: aibom-webhook-selfsigned
  namespace: aibom-system
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: aibom-webhook-certs
  namespace: aibom-system
spec:
  secretName: aibom-webhook-certs
  dnsNames:
    - aibom-webhook.aibom-system.svc
    - aibom-webhook.aibom-system.svc.cluster.local
  issuerRef:
    name: aibom-webhook-selfsigned
    kind: Issuer
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
