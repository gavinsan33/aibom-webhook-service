apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibom-webhook
  namespace: aibom-system
  labels:
    app: aibom-webhook
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aibom-webhook
  template:
    metadata:
      labels:
        app: aibom-webhook
    spec:
      serviceAccountName: aibom-webhook
      containers:
        - name: webhook
          image: image-registry.openshift-image-registry.svc:5000/aibom-system/aibom-webhook-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8443
              name: webhook
          args:
            - --tls-cert=/certs/tls.crt
            - --tls-key=/certs/tls.key
            - --port=8443
            - --postprocess-image=image-registry.openshift-image-registry.svc:5000/aibom-system/aibom-postprocess:latest
            - --enable-watcher=true
            - --aibom-storage-path=/data/aiboms
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
            - name: aibom-storage
              mountPath: /data/aiboms
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: aibom-storage-browser
          image: nginxinc/nginx-unprivileged:stable
          ports:
            - containerPort: 8080
              name: aibom-http
          volumeMounts:
            - name: aibom-storage
              mountPath: /data/aiboms
              readOnly: true
            - name: aibom-nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: aibom-nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: certs
          secret:
            secretName: aibom-webhook-certs
        - name: aibom-storage
          persistentVolumeClaim:
            claimName: aibom-storage
        - name: aibom-nginx-conf
          configMap:
            name: aibom-storage-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: aibom-webhook
  namespace: aibom-system
spec:
  selector:
    app: aibom-webhook
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
