{{- if .Values.vllmMetrics.enabled }}
# Tells OpenShift's user-workload-monitoring Prometheus to scrape each serving
# engine's own /metrics endpoint (TTFT, ITL, queue depth, KV-cache usage -- see
# CLAUDE.md's Inference Performance Telemetry section) on every instrumented pod
# in this namespace, so postprocess.py's serving-engine queries have something
# to read from Thanos Querier in the first place. Without this, those metrics
# are only ever visible in-process on the pod's own port -- nothing scrapes them
# into Prometheus at all, the same way DCGM_FI_DEV_GPU_UTIL wouldn't exist in
# Prometheus without nvidia-gpu-operator's own ServiceMonitor.
#
# A PodMonitor, not a ServiceMonitor: KServe's predictor Service only exposes
# port 80, not the engine container's own serving port, so scraping via the
# Service wouldn't reach it. A PodMonitor scrapes pod IPs directly.
#
# Selector is the same aibom.io/instrumented=true label the webhook already
# stamps on every qualifying pod (mutator.go) -- not an engine-specific label,
# since telling which engine (if any) a pod runs at admission time would require
# duplicating postprocess.py's own CLI-detection logic in the Go mutator.
#
# One endpoint per supported engine's upstream default port (vLLM 8000,
# TGI 80, SGLang 30000, LMDeploy 23333) -- each is each engine's own default,
# not just a convention here. A pod that isn't that engine simply doesn't listen
# on the port (the scrape fails, harmless), and even if something unrelated does,
# postprocess.py's prefixed metric names (vllm:/sglang:/lmdeploy:/tgi_) match
# nothing else. TGI also gets 8080: its default 80 can't be bound under
# OpenShift's restricted SCC (random non-root UID, no NET_BIND_SERVICE), so on
# OpenShift it runs on 8080 the way KServe's TGI runtime does. A workload that
# overrides a port to anything else isn't scraped; there's no
# per-workload override yet (see #86). SGLang needs --enable-metrics (and
# LMDeploy before 0.18) for anything to be there; TGI and LMDeploy 0.18+
# expose metrics by default.
#
# vLLM also gets 8200: an llm-d decode pod runs its routing sidecar on 8000 and
# moves vLLM to 8200 (llm-d-modelservice's routing.proxy.targetPort default).
# The sidecar proxies every path it doesn't handle itself, /metrics included,
# through to vLLM, so scraping its 8000 as well would collect each vLLM series
# twice and double the summed counters and gauges. Every endpoint therefore
# drops init-container targets: the sidecar is a native sidecar (an init
# container with restartPolicy Always), and no serving engine runs as one.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: aibom-vllm-metrics
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      aibom.io/instrumented: "true"
  podMetricsEndpoints:
    - targetPort: 8000   # vLLM
      path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_container_init]
          regex: "true"
          action: drop
    - targetPort: 8200   # vLLM behind llm-d's routing sidecar
      path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_container_init]
          regex: "true"
          action: drop
    - targetPort: 80     # TGI
      path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_container_init]
          regex: "true"
          action: drop
    - targetPort: 8080   # TGI under a restricted SCC (can't bind 80)
      path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_container_init]
          regex: "true"
          action: drop
    - targetPort: 30000  # SGLang
      path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_container_init]
          regex: "true"
          action: drop
    - targetPort: 23333  # LMDeploy
      path: /metrics
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_container_init]
          regex: "true"
          action: drop
{{- end }}
