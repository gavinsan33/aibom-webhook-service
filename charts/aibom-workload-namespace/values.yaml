# Namespace the aibom-webhook chart was installed into. The image-puller
# RoleBinding must live there (OpenShift's system:image-puller access is
# granted from the image's own namespace, not the consuming namespace).
aibomSystemNamespace: project-aibom

# auto, openshift or kubernetes, as in the aibom-webhook chart. On OpenShift
# this chart adds the image-puller RoleBinding.
platform: auto

# Adds a PodMonitor that scrapes vLLM's own /metrics endpoint (TTFT, ITL,
# queue depth, KV-cache usage) on port 8000 for every aibom.io/instrumented
# pod in this namespace, so postprocess.py's inference.performance queries
# (see CLAUDE.md) have data to read. On by default, but it requires the
# Prometheus Operator CRDs (monitoring.coreos.com/v1 PodMonitor) to actually
# exist on the cluster, or the whole chart install fails outright (an
# unrecognized CRD, not a soft permission gap like monitoringAccess' missing
# ClusterRoleBinding). Set to false (`just setup-namespace --skip-vllm-metrics`)
# on a cluster without the Prometheus Operator installed. Also does nothing
# useful unless the aibom-webhook chart's monitoringAccess lets postprocess.py
# read the scraped data back out.
vllmMetrics:
  enabled: true

# Only needed for a local install from a checked-out repo (`just setup-namespace`
# sets these via --set-file, reading straight from scripts/aibom-scripts/*.py, so
# script edits take effect on the very next install). Leave unset for an OCI
# install (`helm upgrade --install ... oci://.../aibom-workload-namespace`) — the
# packaged chart already embeds these scripts under files/ (see `just chart-push`),
# and templates/scripts-configmap.yaml falls back to that embedded copy when these
# are empty.
#   helm install aibom-ns-<team> ./charts/aibom-workload-namespace -n <team> \
#     --set-file scripts.generateSnapshot=scripts/aibom-scripts/generate_snapshot.py \
#     --set-file scripts.runtimeDetector=scripts/aibom-scripts/runtime_detector.py \
#     --set-file scripts.k8sApi=scripts/aibom-scripts/k8s_api.py \
#     --set-file scripts.datasetSidecar=scripts/aibom-scripts/dataset_sidecar.py
scripts:
  generateSnapshot: ""
  runtimeDetector: ""
  k8sApi: ""
  datasetSidecar: ""

# Image for the `helm test` pod, which only needs python3. Empty means the
# postprocess image at this chart's appVersion.
test:
  image: ""
