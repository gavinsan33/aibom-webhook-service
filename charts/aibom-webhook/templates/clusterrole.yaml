apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aibom-webhook
rules:
  # pods: list/watch back the cluster-wide Pod informer; patch is used to add/remove
  # the aibom.io/instrumented label and finalizer. No direct Get/Update call exists.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch", "patch"]
  # namespaces: list/watch back the Namespace informer (used to check the
  # aibom.io/enabled label). The only read is Lister().Get(), which hits the
  # informer's local cache, not the API server, so the "get" verb isn't needed.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "delete"]
  # jobs: list/watch back the Job informer; create/patch/delete are used directly
  # for postprocess Job lifecycle and finalizer management. No direct Get/Update call exists.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch", "create", "patch", "delete"]
  # inferenceservices: a single Get per qualifying predictor pod, to read the
  # declared spec.predictor.model.storage.path/storageUri for model identity.
  # No list/watch — pods identify their owning InferenceService by name via
  # the serving.kserve.io/inferenceservice label, so there's no informer here.
  # Deliberately no "secrets" verb: the referenced data-connection Secret
  # (storage.key) is never read, only the storage path/URI string.
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get"]
