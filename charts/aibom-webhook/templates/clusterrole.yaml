apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aibom-webhook
# Read-only, for the cluster-wide informers. Everything the webhook writes
# (Jobs, ConfigMaps, the per-job ServiceAccount/Role/RoleBinding/token Secret,
# pod and Job finalizer patches) is granted per namespace by
# aibom-workload-namespace's webhook-access.yaml, so it only exists in
# namespaces that installed that chart (#148). Signing-key reads are granted
# the same way, by name, in signing.yaml.
#
# namespaces: the only read is Lister().Get(), which hits the informer's cache,
# so "get" isn't needed.
#
# No serving.kserve.io permission here deliberately: resolving an
# InferenceService's storage.path/storageUri for model identity is done by
# the aibom-discovery init container itself, using the workload's own
# namespace-scoped RBAC (see aibom-workload-namespace's rbac.yaml) — not by
# this always-on, cluster-wide identity. That also avoids the alternative
# (a live Get from the watcher at pod-deletion time) racing against
# Kubernetes' garbage collector, which removes a deleted InferenceService
# from etcd immediately, well before cascading the delete down to its Pod.
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "watch"]
