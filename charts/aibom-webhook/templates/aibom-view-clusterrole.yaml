# Aggregates read access to AIBOM objects into the built-in view/edit/admin
# ClusterRoles, so anyone who already has view/edit/admin in a namespace (e.g.
# an OpenShift project owner) can see AIBOMs there with no separate grant —
# the CRD carries no aggregation label of its own, so without this ClusterRole
# a namespace admin has zero access to aiboms.aibom.io by default.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aibom-view
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  # aibomtelemetries are an AIBOM's downsampled time series (see CLAUDE.md's
  # Telemetry Time Series) -- read alongside the AIBOM they belong to, so
  # whoever can see one can see the other. The standard view ClusterRole
  # doesn't cover custom kinds, hence the explicit grant here.
  - apiGroups: ["aibom.io"]
    resources: ["aiboms", "aibomtelemetries"]
    verbs: ["get", "list", "watch"]
