apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibom-webhook
  namespace: {{ include "aibom-webhook.namespace" . }}
  labels:
    app: aibom-webhook
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aibom-webhook
  template:
    metadata:
      labels:
        app: aibom-webhook
    spec:
      serviceAccountName: aibom-webhook
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: "{{ .Values.image.webhook.repository }}:{{ .Values.image.webhook.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8443
              name: webhook
          args:
            - --tls-cert=/certs/tls.crt
            - --tls-key=/certs/tls.key
            - --port=8443
            - --postprocess-image={{ .Values.image.postprocess.repository }}:{{ .Values.image.postprocess.tag }}
            - --enable-watcher={{ .Values.watcher.enabled }}
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: certs
          secret:
            secretName: aibom-webhook-certs
---
apiVersion: v1
kind: Service
metadata:
  name: aibom-webhook
  namespace: {{ include "aibom-webhook.namespace" . }}
spec:
  selector:
    app: aibom-webhook
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
