apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibom-webhook
  namespace: {{ include "aibom-webhook.namespace" . }}
  labels:
    app: aibom-webhook
    app.kubernetes.io/version: {{ include "aibom-webhook.webhookTag" . | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aibom-webhook
  template:
    metadata:
      labels:
        app: aibom-webhook
        app.kubernetes.io/version: {{ include "aibom-webhook.webhookTag" . | quote }}
    spec:
      serviceAccountName: aibom-webhook
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: "{{ .Values.image.webhook.repository }}:{{ include "aibom-webhook.webhookTag" . }}"
          {{- with .Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8443
              name: webhook
          args:
            - --tls-cert=/certs/tls.crt
            - --tls-key=/certs/tls.key
            - --port=8443
            - --postprocess-image={{ include "aibom-webhook.postprocessImage" . }}
            - --discovery-image={{ include "aibom-webhook.discoveryImage" . }}
            # Reuse the discovery image (bash + python3, already pulled on the
            # node as this pod's init container) rather than the external
            # python:3.12-slim default, so the sidecar never triggers an extra pull.
            - --dataset-sidecar-image={{ include "aibom-webhook.discoveryImage" . }}
            - --enable-watcher={{ .Values.watcher.enabled }}
            - --prometheus-url={{ include "aibom-webhook.prometheusURL" . }}
            - --debug-keep-postprocess-jobs={{ .Values.debug.keepPostprocessJobs }}
            - --debug-telemetry-all-pods={{ .Values.debug.telemetryAllPods }}
            - --registry-label-lookup={{ .Values.gitProvenance.registryLookup }}
            # Matches this Deployment's own serviceAccountName above -- the
            # watcher (running in this same binary) creates postprocess Jobs
            # as this identity, so the webhook can verify a Job claiming
            # aibom.io/postprocess-for was actually created by the watcher
            # and not a workload spoofing the label. See jobguard.go.
            - --trusted-watcher-identity=system:serviceaccount:{{ include "aibom-webhook.namespace" . }}:aibom-webhook
            {{- if .Values.webhook.trustedJobControllerIdentity }}
            # Tightens isPostprocessPod's Job-owner check -- see
            # values.yaml's comment on this setting before enabling it.
            - --trusted-job-controller-identity={{ .Values.webhook.trustedJobControllerIdentity }}
            {{- end }}
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: certs
          secret:
            secretName: aibom-webhook-certs
---
apiVersion: v1
kind: Service
metadata:
  name: aibom-webhook
  namespace: {{ include "aibom-webhook.namespace" . }}
  {{- if eq (include "aibom-webhook.tlsProvider" .) "service-ca" }}
  annotations:
    # The service-ca operator issues a certificate for this Service's DNS name
    # into this Secret, which the Deployment mounts, and rotates it.
    service.beta.openshift.io/serving-cert-secret-name: aibom-webhook-certs
  {{- end }}
spec:
  selector:
    app: aibom-webhook
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
