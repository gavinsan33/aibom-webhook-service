apiVersion: apps/v1
kind: Deployment
metadata:
  name: aibom-webhook
  namespace: {{ include "aibom-webhook.namespace" . }}
  labels:
    app: aibom-webhook
    app.kubernetes.io/version: {{ .Values.image.webhook.tag | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aibom-webhook
  template:
    metadata:
      labels:
        app: aibom-webhook
        app.kubernetes.io/version: {{ .Values.image.webhook.tag | quote }}
    spec:
      serviceAccountName: aibom-webhook
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webhook
          image: "{{ .Values.image.webhook.repository }}:{{ .Values.image.webhook.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8443
              name: webhook
          args:
            - --tls-cert=/certs/tls.crt
            - --tls-key=/certs/tls.key
            - --port=8443
            - --postprocess-image={{ .Values.image.postprocess.repository }}:{{ .Values.image.postprocess.tag }}
            - --enable-watcher={{ .Values.watcher.enabled }}
            # Matches this Deployment's own serviceAccountName above -- the
            # watcher (running in this same binary) creates postprocess Jobs
            # as this identity, so the webhook can verify a Job claiming
            # aibom.io/postprocess-for was actually created by the watcher
            # and not a workload spoofing the label. See jobguard.go.
            - --trusted-watcher-identity=system:serviceaccount:{{ include "aibom-webhook.namespace" . }}:aibom-webhook
            {{- if .Values.webhook.trustedJobControllerIdentity }}
            # Tightens isPostprocessPod's Job-owner check -- see
            # values.yaml's comment on this setting before enabling it.
            - --trusted-job-controller-identity={{ .Values.webhook.trustedJobControllerIdentity }}
            {{- end }}
          volumeMounts:
            - name: certs
              mountPath: /certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: certs
          secret:
            secretName: aibom-webhook-certs
---
apiVersion: v1
kind: Service
metadata:
  name: aibom-webhook
  namespace: {{ include "aibom-webhook.namespace" . }}
spec:
  selector:
    app: aibom-webhook
  ports:
    - port: 443
      targetPort: 8443
      protocol: TCP
