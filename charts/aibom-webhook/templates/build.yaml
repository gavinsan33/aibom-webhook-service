{{- /*
Output tags are driven by image.*.tag rather than hardcoded "latest" so a build's
output lands on the same ImageStreamTag that templates/deployment.yaml pulls from —
tagging both with a commit SHA (see justfile `tag` recipe arg) keeps every build immutable
and rollback-able instead of always overwriting one mutable "latest" tag in place.
*/ -}}
{{- if .Values.build.enabled }}
{{- if not (include "aibom-webhook.openshift" .) }}
{{- fail "build.enabled=true needs OpenShift BuildConfigs; use prebuilt images on other clusters" }}
{{- end }}
{{- range list
  (dict "name" "aibom-webhook-service" "dockerfile" "Dockerfile" "tag" "webhookTag")
  (dict "name" "aibom-postprocess" "dockerfile" "postprocess/Dockerfile" "tag" "postprocessTag")
  (dict "name" "aibom-discovery" "dockerfile" "discovery/Dockerfile" "tag" "discoveryTag") }}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ .name }}
  namespace: {{ include "aibom-webhook.namespace" $ }}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ .name }}
  namespace: {{ include "aibom-webhook.namespace" $ }}
spec:
  source:
    type: Git
    git:
      uri: {{ $.Values.build.gitRepo }}
      ref: {{ $.Values.build.gitRef }}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: {{ .dockerfile }}
  output:
    to:
      kind: ImageStreamTag
      name: {{ .name }}:{{ include (printf "aibom-webhook.%s" .tag) $ }}
  triggers:
    - type: ConfigChange
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: aibom-discovery
  namespace: {{ include "aibom-webhook.namespace" . }}
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: aibom-discovery
  namespace: {{ include "aibom-webhook.namespace" . }}
spec:
  source:
    type: Git
    git:
      uri: {{ .Values.build.gitRepo }}
      ref: {{ .Values.build.gitRef }}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: discovery/Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: aibom-discovery:{{ .Values.image.discovery.tag | default .Chart.AppVersion }}
  triggers:
    - type: ConfigChange
{{- end }}
{{- end }}
