{{- if .Values.finalizerCleanup.enabled }}
# Strips our finalizers on uninstall; see CLAUDE.md "Stale Finalizers" (#104).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aibom-webhook-finalizer-cleanup
  namespace: {{ include "aibom-webhook.namespace" . }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aibom-webhook-finalizer-cleanup
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  # Cluster-wide list (it has to find objects in namespaces that already
  # opted out) plus get/patch to drop one finalizer. Nothing else.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get", "patch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["list", "get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aibom-webhook-finalizer-cleanup
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aibom-webhook-finalizer-cleanup
subjects:
  - kind: ServiceAccount
    name: aibom-webhook-finalizer-cleanup
    namespace: {{ include "aibom-webhook.namespace" . }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aibom-webhook-finalizer-cleanup
  namespace: {{ include "aibom-webhook.namespace" . }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: aibom-webhook-finalizer-cleanup
    spec:
      serviceAccountName: aibom-webhook-finalizer-cleanup
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cleanup
          image: "{{ .Values.image.webhook.repository }}:{{ .Values.image.webhook.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --strip-finalizers
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{- end }}
