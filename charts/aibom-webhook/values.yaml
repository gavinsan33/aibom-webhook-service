# Defaults to the Quay build triggers that auto-build both images on every push
# to main (see README's Cluster Deployment section) — the seamless, no-cluster-
# permission-needed path. `just deploy` (build.enabled=true) overrides both
# repositories to the in-cluster registry path instead, since that's where its
# BuildConfig actually writes; see justfile.
#
# When build.enabled=true, tag also names the ImageStreamTag the in-cluster
# BuildConfig writes to (see templates/build.yaml) — the two must move together.
# Override both to a commit SHA (justfile `tag` recipe arg) for immutable, rollback-able
# builds instead of always overwriting "latest" in place.
image:
  webhook:
    repository: quay.io/gsanders/aibom-webhook-service
    tag: latest
  postprocess:
    repository: quay.io/gsanders/aibom-postprocess
    tag: latest
  # Image for the aibom-discovery init container injected into instrumented
  # pods (see CLAUDE.md's "Pod Matching and Injection") — unlike webhook/
  # postprocess above, this is never built by this project's BuildConfig
  # (build.enabled has no effect on it); it only needs python3 + bash on
  # PATH, since generate_snapshot.py uses stdlib only and shells out to
  # nvidia-smi (which the NVIDIA Container Toolkit injects at runtime
  # regardless of base image). Defaults to a public image so this works with
  # no extra setup; swap for something already mirrored in-cluster (e.g. an
  # OpenShift AI runtime ImageStream) to avoid an external pull per pod.
  discovery:
    repository: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/runtime-pytorch
    tag: pytorch
  pullPolicy: Always

replicaCount: 1
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

certManager:
  issuerName: aibom-webhook-selfsigned
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days

webhook:
  failurePolicy: Ignore
  reinvocationPolicy: Never
  # Namespaces must carry this label to opt in to pod mutation.
  namespaceSelectorLabel:
    key: aibom.io/enabled
    value: "true"
  # Full username the cluster's built-in Job controller uses when creating a
  # Job's pods (commonly system:serviceaccount:kube-system:job-controller,
  # depending on kube-controller-manager's --use-service-account-credentials
  # flag). Verify this on your own cluster before setting it -- an incorrect
  # value misclassifies real postprocess pods, not just spoofed ones. Left
  # empty (the default), only the weaker ownerReference-only check applies;
  # see CLAUDE.md's postprocess-for trust boundary section.
  trustedJobControllerIdentity: ""

# OpenShift BuildConfig/ImageStream resources that build the webhook and
# postprocess images from source in-cluster. Opt-in (via `just deploy`) for
# clusters that specifically want in-cluster builds instead of pulling
# Quay-built images — e.g. no egress to quay.io, or no external registry account.
build:
  enabled: false
  gitRepo: https://github.com/gavinsan33/aibom-webhook-service.git
  gitRef: main

watcher:
  enabled: true

# Prometheus/Thanos endpoint the postprocess Job queries directly for telemetry.
# Auth (bearer ServiceAccount token) and TLS trust (the service-ca ConfigMap
# aibom-workload-namespace creates per opted-in namespace, or the system trust
# store if that's absent) are always automatic — see postprocess.py. Empty
# disables telemetry collection entirely.
prometheus:
  url: https://thanos-querier.openshift-monitoring.svc:9091

# Optional, purely for a clickable Grafana Explore deep link in the AIBOM
# (resource_utilization.grafana_links) — actual telemetry queries always go
# straight to prometheus.url above, never through Grafana. datasourceUid is
# the UID of the Grafana datasource pointing at that same Prometheus. Leave
# both empty to omit the link entirely.
grafana:
  url: ""
  datasourceUid: ""

# debug.keepPostprocessJobs skips the usual cleanup of a succeeded (or failed)
# postprocess Job/data ConfigMap, for inspecting postprocess pod logs/exit
# state or the data ConfigMap's contents after the fact. Leaves one Job and
# one ConfigMap behind per completed workload indefinitely — a debugging aid,
# not something to leave on in production.
#
# debug.telemetryAllPods makes postprocess Jobs query Prometheus telemetry for
# every pod regardless of detected GPU count (postprocess.py normally skips a
# pod with gpu_count 0/missing, since there's no GPU utilization to query).
# Intended for local testing on clusters with no real GPU hardware (e.g. kind),
# where nvidia-smi always reports zero GPUs and telemetry would otherwise never
# run at all — not something to leave on in production.
debug:
  keepPostprocessJobs: false
  telemetryAllPods: false
