# When build.enabled=true, tag also names the ImageStreamTag the in-cluster
# BuildConfig writes to (see templates/build.yaml) — the two must move together.
# Override both to a commit SHA (justfile `tag` recipe arg) for immutable, rollback-able
# builds instead of always overwriting "latest" in place.
image:
  webhook:
    repository: image-registry.openshift-image-registry.svc:5000/aibom-system/aibom-webhook-service
    tag: latest
  postprocess:
    repository: image-registry.openshift-image-registry.svc:5000/aibom-system/aibom-postprocess
    tag: latest
  pullPolicy: Always

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

certManager:
  issuerName: aibom-webhook-selfsigned
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days

webhook:
  failurePolicy: Ignore
  reinvocationPolicy: Never
  # Namespaces must carry this label to opt in to pod mutation.
  namespaceSelectorLabel:
    key: aibom.io/enabled
    value: "true"

# OpenShift BuildConfig/ImageStream resources that build the webhook and
# postprocess images from source in-cluster. Disable if images are built and
# pushed externally instead.
build:
  enabled: true
  gitRepo: https://github.com/gavinsan33/aibom-webhook-service.git
  gitRef: master

watcher:
  enabled: true

# Prometheus/Thanos endpoint the postprocess Job queries directly for telemetry.
# Auth (bearer ServiceAccount token) and TLS trust (the service-ca ConfigMap
# aibom-workload-namespace creates per opted-in namespace, or the system trust
# store if that's absent) are always automatic — see postprocess.py. Empty
# disables telemetry collection entirely.
prometheus:
  url: https://thanos-querier.openshift-monitoring.svc:9091

# Optional, purely for a clickable Grafana Explore deep link in the AIBOM
# (resource_utilization.grafana_links) — actual telemetry queries always go
# straight to prometheus.url above, never through Grafana. datasourceUid is
# the UID of the Grafana datasource pointing at that same Prometheus. Leave
# both empty to omit the link entirely.
grafana:
  url: ""
  datasourceUid: ""

# debug.keepPostprocessJobs skips the usual cleanup of a succeeded (or failed)
# postprocess Job/data ConfigMap, for inspecting postprocess pod logs/exit
# state or the data ConfigMap's contents after the fact. Leaves one Job and
# one ConfigMap behind per completed workload indefinitely — a debugging aid,
# not something to leave on in production.
debug:
  keepPostprocessJobs: false
