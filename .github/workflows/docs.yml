name: Docs

# PRs: build with --strict so broken links/nav fail CI.
# main: build and publish to GitHub Pages (Settings -> Pages -> Source:
# "GitHub Actions" must be enabled once).
on:
  pull_request:
    paths: &paths
      - "docs/**"
      - "mkdocs.yml"
      - "examples/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
