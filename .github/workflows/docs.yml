name: Docs

# Standalone strict build so broken links or nav fail the PR. The published
# site is built from gavinsan33/project-aibom, which includes these docs.
on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "examples/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
