name: Release

# Pushing a tag vX.Y.Z publishes release X.Y.Z: the three images tagged X.Y.Z and
# both charts at version and appVersion X.Y.Z, so the charts' image defaults
# point at exactly these builds. Nothing is ever republished: the job fails if
# any image tag or chart version already exists (#150).
#
# The Quay robot needs push access to the three image repos as well as the two
# chart repos.
#
# The charts are also added to a classic Helm repository (index.yaml) on the
# gh-pages branch, served by GitHub Pages at HELM_REPO_URL, since OpenShift's
# HelmChartRepository only documents plain HTTP repositories, not OCI.
on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: quay.io/project-aibom
  HELM_REPO_URL: https://gavinsan33.github.io/aibom-webhook-service

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Refuse to overwrite existing image tags
        run: |
          for image in aibom-webhook-service aibom-postprocess aibom-discovery; do
            if docker buildx imagetools inspect "$REGISTRY/$image:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
              echo "$REGISTRY/$image:${{ steps.version.outputs.version }} already exists" >&2; exit 1
            fi
          done

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/aibom-webhook-service:${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: postprocess/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/aibom-postprocess:${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: discovery/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/aibom-discovery:${{ steps.version.outputs.version }}

      - uses: azure/setup-helm@v4

      - uses: extractions/setup-just@v2

      - name: Log Helm in to Quay
        run: |
          helm registry login quay.io \
            --username "${{ secrets.QUAY_ROBOT_USERNAME }}" \
            --password "${{ secrets.QUAY_ROBOT_TOKEN }}"

      - name: Publish charts
        run: just chart-push --version=${{ steps.version.outputs.version }} --repo=$REGISTRY --out=dist

      # Generate the community chart-verifier reports for exactly this version, so
      # their chart digest matches the charts just published. Uploaded as workflow
      # artifacts to hand to the OpenShift Helm catalog PR (charts/community/...),
      # not committed back -- that submission is a separate manual step.
      - name: Generate community chart-verifier reports
        run: just chart-verify --version=${{ steps.version.outputs.version }} --out=reports

      - name: Upload chart-verifier reports
        uses: actions/upload-artifact@v4
        with:
          name: chart-verifier-reports-${{ steps.version.outputs.version }}
          path: reports/*-report.yaml

      - name: Add the charts to the Helm repository on gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then
            git worktree add pages origin/gh-pages
            git -C pages switch -c gh-pages
          else
            git worktree add --orphan -b gh-pages pages
          fi
          cp dist/*.tgz pages/
          merge=()
          [[ -f pages/index.yaml ]] && merge=(--merge pages/index.yaml)
          helm repo index pages --url "$HELM_REPO_URL" "${merge[@]}"
          git -C pages add .
          git -C pages commit -m "Release ${{ steps.version.outputs.version }}"
          git -C pages push origin gh-pages
