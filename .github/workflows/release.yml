name: Release

# Pushing a tag vX.Y.Z publishes release X.Y.Z: the three images tagged X.Y.Z and
# both charts at version and appVersion X.Y.Z, so the charts' image defaults
# point at exactly these builds. Nothing is ever republished: the job fails if
# any image tag or chart version already exists (#150).
#
# The Quay robot needs push access to the three image repos as well as the two
# chart repos.
#
# Both chart tarballs are also attached to a GitHub release for the tag, along
# with aibom-webhook-X.Y.Z-catalog.tgz, the webhook chart without its CRDs.
on:
  push:
    tags: ["v*.*.*"]

env:
  REGISTRY: quay.io/project-aibom

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_ROBOT_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Refuse to overwrite existing image tags
        run: |
          for image in aibom-webhook-service aibom-postprocess aibom-discovery; do
            if docker buildx imagetools inspect "$REGISTRY/$image:${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
              echo "$REGISTRY/$image:${{ steps.version.outputs.version }} already exists" >&2; exit 1
            fi
          done

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/aibom-webhook-service:${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: postprocess/Dockerfile
          build-args: VERSION=${{ steps.version.outputs.version }}
          push: true
          tags: ${{ env.REGISTRY }}/aibom-postprocess:${{ steps.version.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: discovery/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/aibom-discovery:${{ steps.version.outputs.version }}

      - uses: azure/setup-helm@v4

      - uses: extractions/setup-just@v2

      - name: Log Helm in to Quay
        run: |
          helm registry login quay.io \
            --username "${{ secrets.QUAY_ROBOT_USERNAME }}" \
            --password "${{ secrets.QUAY_ROBOT_TOKEN }}"

      - name: Publish charts
        run: just chart-push --version=${{ steps.version.outputs.version }} --repo=$REGISTRY --out=dist

      # The catalog doesn't accept charts with CRDs, so it gets this copy of the
      # webhook chart; its users install the CRDs separately.
      - name: Package the webhook chart for the OpenShift Helm catalog
        run: just _chart-package-catalog dist ${{ steps.version.outputs.version }}

      # `just catalog-submit` submits aibom-webhook-X.Y.Z-catalog.tgz and the
      # namespace chart's tarball to the OpenShift Helm catalog
      # (charts/community/project-aibom/<chart>/X.Y.Z/), which hosts its own copy.
      - name: Create the GitHub release with the chart tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --verify-tag --generate-notes
