name: Notify monorepo

# Tells gavinsan33/project-aibom to sync whenever the default branch changes.
# Requires the MONOREPO_DISPATCH_TOKEN secret (fine-grained PAT with Contents: read/write on project-aibom).
on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger monorepo sync
        env:
          GH_TOKEN: ${{ secrets.MONOREPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/gavinsan33/project-aibom/dispatches \
            -f event_type=source-updated \
            -f 'client_payload[repo]=${{ github.repository }}'
