name: Publish charts to Quay

# The charts' counterpart to images.yml, which rebuilds :latest on every push
# to main. Restricted to pushes that land on main
# (i.e. merges, not every commit on a feature branch) and only when chart
# content actually changed. These are dev builds (<version>-<sha>, images
# :latest); releases come from release.yml on a vX.Y.Z tag.
on:
  push:
    branches: [main]
    paths:
      - "charts/aibom-webhook/**"
      - "charts/aibom-workload-namespace/**"
      # Not under charts/, but `just chart-push` embeds these into the
      # aibom-workload-namespace package (see that recipe) — a change here
      # changes the chart's actual content just as much as a template edit.
      - "scripts/aibom-scripts/**"

jobs:
  chart-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: extractions/setup-just@v2

      # Robot account, not a personal Quay login — scope it to push-only access
      # on the aibom-webhook/aibom-workload-namespace repos, same as any other
      # CI credential.
      - name: Log in to Quay
        run: |
          helm registry login quay.io \
            --username "${{ secrets.QUAY_ROBOT_USERNAME }}" \
            --password "${{ secrets.QUAY_ROBOT_TOKEN }}"

      - name: Publish charts
        run: just chart-push
